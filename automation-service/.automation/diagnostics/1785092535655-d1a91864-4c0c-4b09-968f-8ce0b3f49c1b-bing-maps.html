</style><style type="text/css">/* ---------------- spin ---------------- */
.ov-spin:not(.ov-hover),
.ov-spin.ov-hover:hover,
.ov-parent.ov-hover:hover > .ov-spin {
  animation: ov-spin 1s linear infinite;
}

.ov-spin:not(.ov-hover).ov-fast,
.ov-spin.ov-hover.ov-fast:hover,
.ov-parent.ov-hover:hover > .ov-spin.ov-fast {
  animation: ov-spin 0.7s linear infinite;
}

.ov-spin:not(.ov-hover).ov-slow,
.ov-spin.ov-hover.ov-slow:hover,
.ov-parent.ov-hover:hover > .ov-spin.ov-slow {
  animation: ov-spin 2s linear infinite;
}

/* ---------------- spin-pulse ---------------- */

.ov-spin-pulse:not(.ov-hover),
.ov-spin-pulse.ov-hover:hover,
.ov-parent.ov-hover:hover > .ov-spin-pulse {
  animation: ov-spin 1s infinite steps(8);
}

.ov-spin-pulse:not(.ov-hover).ov-fast,
.ov-spin-pulse.ov-hover.ov-fast:hover,
.ov-parent.ov-hover:hover > .ov-spin-pulse.ov-fast {
  animation: ov-spin 0.7s infinite steps(8);
}

.ov-spin-pulse:not(.ov-hover).ov-slow,
.ov-spin-pulse.ov-hover.ov-slow:hover,
.ov-parent.ov-hover:hover > .ov-spin-pulse.ov-slow {
  animation: ov-spin 2s infinite steps(8);
}

@keyframes ov-spin {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}

/* ---------------- wrench ---------------- */
.ov-wrench:not(.ov-hover),
.ov-wrench.ov-hover:hover,
.ov-parent.ov-hover:hover > .ov-wrench {
  animation: ov-wrench 2.5s ease infinite;
}

.ov-wrench:not(.ov-hover).ov-fast,
.ov-wrench.ov-hover.ov-fast:hover,
.ov-parent.ov-hover:hover > .ov-wrench.ov-fast {
  animation: ov-wrench 1.2s ease infinite;
}

.ov-wrench:not(.ov-hover).ov-slow,
.ov-wrench.ov-hover.ov-slow:hover,
.ov-parent.ov-hover:hover > .ov-wrench.ov-slow {
  animation: ov-wrench 3.7s ease infinite;
}

@keyframes ov-wrench {
  0% {
    transform: rotate(-12deg);
  }

  8% {
    transform: rotate(12deg);
  }

  10%, 28%, 30%, 48%, 50%, 68% {
    transform: rotate(24deg);
  }

  18%, 20%, 38%, 40%, 58%, 60% {
    transform: rotate(-24deg);
  }

  75%, 100% {
    transform: rotate(0deg);
  }
}

/* ---------------- ring ---------------- */
.ov-ring:not(.ov-hover),
.ov-ring.ov-hover:hover,
.ov-parent.ov-hover:hover > .ov-ring {
  animation: ov-ring 2s ease infinite;
}

.ov-ring:not(.ov-hover).ov-fast,
.ov-ring.ov-hover.ov-fast:hover,
.ov-parent.ov-hover:hover > .ov-ring.ov-fast {
  animation: ov-ring 1s ease infinite;
}

.ov-ring:not(.ov-hover).ov-slow,
.ov-ring.ov-hover.ov-slow:hover,
.ov-parent.ov-hover:hover > .ov-ring.ov-slow {
  animation: ov-ring 3s ease infinite;
}

@keyframes ov-ring {
  0% {
    transform: rotate(-15deg);
  }

  2% {
    transform: rotate(15deg);
  }

  4%, 12% {
    transform: rotate(-18deg);
  }

  6% {
    transform: rotate(18deg);
  }

  8% {
    transform: rotate(-22deg);
  }

  10% {
    transform: rotate(22deg);
  }

  12% {
    transform: rotate(-18deg);
  }

  14% {
    transform: rotate(18deg);
  }

  16% {
    transform: rotate(-12deg);
  }

  18% {
    transform: rotate(12deg);
  }

  20%, 100% {
    transform: rotate(0deg);
  }
}

/* ---------------- pulse ---------------- */
.ov-pulse:not(.ov-hover),
.ov-pulse.ov-hover:hover,
.ov-parent.ov-hover:hover > .ov-pulse {
  animation: ov-pulse 2s linear infinite;
}

.ov-pulse:not(.ov-hover).ov-fast,
.ov-pulse.ov-hover.ov-fast:hover,
.ov-parent.ov-hover:hover > .ov-pulse.ov-fast {
  animation: ov-pulse 1s linear infinite;
}

.ov-pulse:not(.ov-hover).ov-slow,
.ov-pulse.ov-hover.ov-slow:hover,
.ov-parent.ov-hover:hover > .ov-pulse.ov-slow {
  animation: ov-pulse 3s linear infinite;
}

@keyframes ov-pulse {
  0% {
    transform: scale(1.1);
  }

  50% {
    transform: scale(0.8);
  }

  100% {
    transform: scale(1.1);
  }
}

/* ---------------- flash ---------------- */
.ov-flash:not(.ov-hover),
.ov-flash.ov-hover:hover,
.ov-parent.ov-hover:hover > .ov-flash {
  animation: ov-flash 2s ease infinite;
}

.ov-flash:not(.ov-hover).ov-fast,
.ov-flash.ov-hover.ov-fast:hover,
.ov-parent.ov-hover:hover > .ov-flash.ov-fast {
  animation: ov-flash 1s ease infinite;
}

.ov-flash:not(.ov-hover).ov-slow,
.ov-flash.ov-hover.ov-slow:hover,
.ov-parent.ov-hover:hover > .ov-flash.ov-slow {
  animation: ov-flash 3s ease infinite;
}

@keyframes ov-flash {
  0%, 100%, 50%{
    opacity: 1;
  }
  25%, 75%{
    opacity: 0;
  }
}

/* ---------------- float ---------------- */
.ov-float:not(.ov-hover),
.ov-float.ov-hover:hover,
.ov-parent.ov-hover:hover > .ov-float {
  animation: ov-float 2s linear infinite;
}

.ov-float:not(.ov-hover).ov-fast,
.ov-float.ov-hover.ov-fast:hover,
.ov-parent.ov-hover:hover > .ov-float.ov-fast {
  animation: ov-float 1s linear infinite;
}

.ov-float:not(.ov-hover).ov-slow,
.ov-float.ov-hover.ov-slow:hover,
.ov-parent.ov-hover:hover > .ov-float.ov-slow {
  animation: ov-float 3s linear infinite;
}

@keyframes ov-float {
  0%, 100% {
    transform: translateY(-3px);
  }
  50% {

  --rw-red-dot-color: #ff4c4c;
}

div[data-rewards-widget].medallion {
  --rw-medal-color: #174ae4;
  --rw-medal-color-glow: #1e90ff;
  --rw-font-color: #333333;
  --rw-red-dot-color: #c80000;
  --rw-red-dot-diameter: 7px;
  display: inline-block;
  cursor: pointer;
  position: relative;
}

div[data-rewards-widget].medallion:not(.copilotSearch) > div {
  display: flex;
  align-items: center;
  text-decoration: none;
  height: 100%;
  padding: 0 4px;
}

div[data-rewards-widget].medallion:not(.copilotSearch) > div > * {
  padding: 0 4px;
  display: flex;
}

div[data-rewards-widget].medallion:not(.copilotSearch) .points-container {
  color: var(--rw-color, var(--rw-font-color));
  font-family: var(--rw-font-family);
  font-feature-settings: 'tnum';
  font-variant-numeric: tabular-nums;
  display: inline-block;
  text-align: right;
}

div[data-rewards-widget].medallion:not(.copilotSearch) div.medal {
  position: relative;
}

@keyframes rw-medal-ripple {
  0% {
    box-shadow: 0 0 0 0 rgba(78, 131, 246, 0), 0 0 0 2px rgba(78, 131, 246, 1);
    opacity: 1;
  }

  20% {
    box-shadow: 0 0 0 2px rgba(78, 131, 246, 0.5), 0 0 0 2px rgba(78, 131, 246, 0.8);
    opacity: 1;
  }

  50% {
    box-shadow: 0 0 0 6px rgba(78, 131, 246, 0.3), 0 0 0 2px rgba(78, 131, 246, 0.5);
    opacity: 0.8;
  }

  80% {
    box-shadow: 0 0 0 8px rgba(78, 131, 246, 0.15), 0 0 0 2px rgba(78, 131, 246, 0.2);
    opacity: 0.3;
  }

  100% {
    box-shadow: 0 0 0 12px rgba(78, 131, 246, 0), 0 0 0 2px rgba(78, 131, 246, 0);
    opacity: 0;
  }
}

div[data-rewards-widget].medallion.glow-medal:not(.copilotSearch):not(.frozen):not(.ocean-commotion) div.medal::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 29px;
  height: 29px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  animation: rw-medal-ripple 1s ease-out 3;
  pointer-events: none;
}

div[data-rewards-widget].medallion:not(.copilotSearch) svg.medal-circled {
  width: 32px;
  height: 32px;
  fill: var(--rw-color, var(--rw-medal-color));
}

div[data-rewards-widget].medallion svg.medal-new-level {
  width: 20px;
  height: 20px;
}

div[data-rewards-widget].medallion svg.medal-newlevel-circled {
  width: 32px;
  height: 32px;
}

div[data-rewards-widget].medallion svg.medal-circled circle {
  stroke: var(--rw-color, var(--rw-medal-color));
}

div[data-rewards-widget].medallion .light-ring svg.medal-circled circle {
  opacity: 0.3;
}

div[data-rewards-widget].medallion svg.medal-light {
  width: 32px;
  height: 32px;
  fill: var(--rw-color, var(--rw-medal-color));
}

div[data-rewards-widget].medallion .red-dot {
  width: var(--rw-red-dot-diameter);
  height: var(--rw-red-dot-diameter);
  border-radius: 50%;
  background-color: var(--rw-red-dot-color);
  top: -3px;
  right: 1px;
  position: absolute;
}

div[data-rewards-widget].medallion .red-dot.adjacent {
  right: 0;
  top: 0;
}

/* Copilot Search styles*/
div[data-rewards-widget].medallion.copilotSearch .points-container {
  color: var(--acf-color-fore-neutral-quaternary, rgba(0, 0, 0, 0.6));
  text-align: center;
  font-size: 13px;
  font-style: normal;
  font-weight: 400;
  line-height: 20px;
}

div[data-rewards-widget].medallion.copilotSearch .b_clickarea:hover .points-container {
  color: var(--acf-color-fore-neutral-secondary, rgba(0, 0, 0, 0.8));
}

div[data-rewards-widget].medallion.copilotSearch.rw-dark .points-container {
  color: var(--acf-color-fore-neutral-quaternary, rgba(255, 255, 255, 0.6));
}

div[data-rewards-widget].medallion.copilotSearch.rw-dark .b_clickarea:hover .points-container {
  color: var(--acf-color-fore-neutral-secondary, rgba(255, 255, 255, 0.8));
}

div[data-rewards-widget].medallion.copilotSearch div.medal {
  display: flex;
  align-items: center;
  justify-content: inherit;
}

div[data-rewards-widget].medallion.copilotSearch svg.medal-circled {
  fill: black;
  height: 17px;
  fill-opacity: 0.6;
}

div[data-rewards-widget].medallion.copilotSearch .b_clickarea:hover svg.medal-circled {
  fill: #202020;
  fill-opacity: unset;
}

div[data-rewards-widget].medallion.copilotSearch.rw-dark svg.medal-circled {
  fill: white;
}

div[data-rewards-widget].medallion.copilotSearch.rw-dark .b_clickarea:hover svg.medal-circled {
  fill: #cfdeff;
}
